<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{htmlTitle}}</title>
  <meta name="description" content="{{metaDesc}}" />
  <link rel="canonical" href="{{canonical}}" />
  {{hreflangLinks}}
  {{ogMeta}}
  {{jsonld}}
  <link rel="icon" href="{{favicon}}" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#233D4D" />
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <style>{{css}}</style>
  {{dirCss}}
</head>
<body>
  {{breadcrumbs}}
  <main class="container">
    <header class="hero">
      <div class="logo-mark yt-logo" aria-hidden="true"></div>
      <h1>{{h1}}</h1>
      <p class="subtitle">{{subtitle}}</p>
      {{langSwitch}}
    </header>

    <section class="card" aria-label="{{h1}}">
      <div class="url-row">
        <input id="urlInput" class="url-input" type="url" inputmode="url" spellcheck="false" autocomplete="off"
          placeholder="{{placeholder}}" aria-label="{{placeholder}}" />
        <button id="btnFetch" class="primary" title="{{getThumbs}}" aria-label="{{getThumbs}}">{{getThumbs}}</button>
        <button id="btnExample" class="ghost" title="{{example}}" aria-label="{{example}}">{{example}}</button>
        <button id="btnClear" class="ghost" title="{{clear}}" aria-label="{{clear}}">{{clear}}</button>
      </div>
      <p class="tips" role="note">{{tips}}</p>
      <div class="example-chips" id="exampleChips" aria-label="Examples"></div>

      <div id="errorBox" class="error-box" role="alert" hidden></div>

      <div id="results" hidden>
        <div class="video-meta">
          <div class="video-title" id="videoTitle"></div>
          <div class="video-channel" id="videoChannel" hidden></div>
          <a id="videoLink" class="video-link" href="#" target="_blank" rel="noopener">{{openVideo}}</a>
        </div>

        <div class="preview-wrap">
          <img id="preview" class="preview-img" alt="{{h1}}" />
        </div>

        <div class="grid-head">
          <h2 class="grid-title">{{sizesTitle}}</h2>
          <p class="grid-sub">{{sizesSub}}</p>
        </div>
        <div id="thumbGrid" class="thumb-grid"></div>
      </div>
    </section>

    {{contentSections}}
  </main>

  {{footer}}

  {{langSwitchScript}}
  {{uiTextScript}}
  <script>{{js}}</script>
</body>
</html>
